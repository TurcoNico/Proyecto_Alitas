<!DOCTYPE html>
<html>
<head>
    <title>Confirmar Eliminación</title>
</head>
<body>
    <h1>¿Estás seguro de que deseas eliminar este contacto?</h1>
    <p>{{ contacto.telefono }} - {{ contacto.celular }} - {{ contacto.correo_electronico }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Eliminar</button>
    </form>
    <a href="{% url 'contactos_list' %}">Cancelar</a>
</body>
</html>
