<!DOCTYPE html>
<html>
<head>
    <title>{% if form.instance.pk %}Editar Contacto{% else %}Nuevo Contacto{% endif %}</title>
</head>
<body>
    <h1>{% if form.instance.pk %}Editar Contacto{% else %}Nuevo Contacto{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% if form.instance.pk %}Actualizar{% else %}Guardar{% endif %}</button>
    </form>
    <a href="{% url 'contactos_list' %}">Cancelar</a>
</body>
</html>
