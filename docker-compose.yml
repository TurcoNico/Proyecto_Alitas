services:
  db:
    image: mysql:8.4
    container_name: db_mysql_clinicalproject
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: alitasparavolar
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build:
     context: .
     dockerfile: Dockerfile
    container_name: web_django_clinicalproject
    working_dir: /opt/back_end/clinicalproject/
    command: /bin/sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: /bin/sh -c "cd /opt/back_end && chmod +x healthcheck.sh && ./healthcheck.sh"
    volumes:
      - type: bind
        source: .
        target: /opt/back_end/
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true
    depends_on:
      - db
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - MYSQL_DB=alitasparavolar

volumes:
  db_data:
